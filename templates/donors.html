<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drops | Donate Drop Of Blood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="navbar bg-red">
        <div class="container d-flex justify-content-center">
            <a class="navbar-brand text-light mb-0 h1" href="/"><i class="bi bi-droplet-fill"></i> Drops</a>
        </div>
    </nav>
    <!-- navbar -->
    <section id="donors-section">
        <div class="container">
            <div class="row">
                <div class="col-md-6 offset-md-3 mt-5">
                    <div class="filter">
                        <i class="bi bi-funnel"></i> ফিল্টার ব্লাড গ্রুপ
                    </div>
                    <div class="my-1 d-flex justify-content-center">
                        <form id="filter-blood">{% csrf_token %}
                            <select class="form-select form-control mb-3" id="selectGroup">
                                <option selected value="all">রক্তের গ্রুপ নির্বাচন করুন</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </form>
                        <!-- login form ends here  -->
                    </div>

                    <h3 class="mt-5 donor-title">রক্তদাতার তালিকা</h3>
                    <!-- Show all donors -->
                    <div class="donor-wrap d-flex flex-column justify-content-between mt-3" id="donor-wrap">
                        {% comment %} Donor list {% endcomment %}
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.min.js"
        integrity="sha384-Rx+T1VzGupg4BHQYs2gCW9It+akI2MM/mndMCy36UVfodzcJcF0GGLxZIzObiEfa"
        crossorigin="anonymous"></script>
</body>
</html>
